name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project LiXiaopengImmortal.xcodeproj \
            -scheme LiXiaopengImmortal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LiXiaopengImmortal.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LiXiaopengImmortal-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiXiaopengImmortal-unsigned-IPA
          path: LiXiaopengImmortal-unsigned.ipa
          if-no-files-found: error
